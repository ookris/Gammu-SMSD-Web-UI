# Gammu SMSD Web UI – konfiguracja nginx. Instalator podstawia __HOST__, __ROOT__ i __FPM__.
# Limit żądań HTTP API (/api/…) na adres klienta
limit_req_zone $binary_remote_addr zone=smsgui_api:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;
    root __ROOT__/public;
    index index.php;
    client_max_body_size 6m;

    # Tylko sieć lokalna. Dostęp z zewnątrz – najlepiej przez VPN; inaczej HTTPS i fail2ban.
    allow 127.0.0.1;  allow ::1;
    allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; allow fc00::/7;
    deny all;

    location / {
        try_files $uri /index.php?$query_string;
    }
    location /api/ {
        limit_req zone=smsgui_api burst=20 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }
    location = /index.php {                      # wykonywany jest tylko front controller
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__FPM__;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
